[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "triple-pendulum"
version = "0.1.0"
description = "Gymnasium MuJoCo inverted triple pendulum (double + one more pole)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zac Westbrook" }]
dependencies = [
  "gymnasium[mujoco]>=1.0.0",
  "mujoco>=2.3.3",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "imageio>=2.31"]
train = ["stable-baselines3[extra]>=2.3.0"]
hr = [
  "mujoco>=3.14.0",
  "torch>=2.0",
  "wandb>=0.16",
  "imageio[ffmpeg]>=2.31",
  "pillow>=10.1",
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["triple_pendulum*"]

[tool.setuptools.package-data]
triple_pendulum = ["assets/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
